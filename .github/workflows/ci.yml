name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: ./Tests/run.sh

      - name: Build app
        run: ./build.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Backuper-app
          path: build/Backuper.zip
          if-no-files-found: error
